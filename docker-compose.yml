services:
  postgres:
    image: postgres:16
    container_name: investing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: investing
      POSTGRES_USER: investing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TZ: Europe/Rome
    ports:
      - "5433:5432"
    volumes:
      - investing_postgres_data:/var/lib/postgresql/data
      - /volume1/docker/configs/investing-platform/app/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  adminer:
    image: adminer:latest
    container_name: investing-adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    depends_on:
      - postgres

  app:
    build:
      context: /volume1/docker/configs/investing-platform
      dockerfile: Dockerfile
    image: investing-platform-app:latest
    container_name: investing-app
    restart: unless-stopped
    environment:
      POSTGRES_DB: investing
      POSTGRES_USER: investing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    working_dir: /workspace
    volumes:
      - /volume1/docker/configs/investing-platform:/workspace
      - /volume1/docker/configs/investing-platform/data:/data
    command: >
      PYTHONPATH=/workspace streamlit run app/dashboard/dashboard.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - postgres

volumes:
  investing_postgres_data:
